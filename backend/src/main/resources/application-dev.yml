# 开发 profile（application.yml 中 spring.profiles.default=dev，通常无需显式指定）
# 显式激活：--spring.profiles.active=dev
# 本地 SMTP 等敏感项：复制 application-local.yml.example → application-local.yml（已 gitignore）

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gamecenter?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    com.example: INFO
    com.baomidou: INFO

jwt:
  secret-key: ${JWT_SECRET_KEY:gamecenter-secret-key-2024-production-environment-please-change-this-key-to-at-least-64-bytes}
  expiration-time: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:10109,http://127.0.0.1:10109,http://localhost:10110,http://127.0.0.1:10110}
  redis:
    local-home: ${GAMECENTER_REDIS_HOME:D:/Redis}
  email:
    from: ${MAIL_FROM:${spring.mail.username:}}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
